[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-screener"
version = "0.1.0"
description = "AI-powered terminal screener for Indian-listed companies (NSE/BSE)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stock Screener" }]
keywords = ["finance", "stocks", "nse", "bse", "screener", "llm", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "platformdirs>=4.2.0",
    "tomli-w>=1.0.0",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "Jinja2>=3.1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.30.0"]
gemini = ["google-genai>=0.3.0"]
all = [
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "google-genai>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "syrupy>=4.6.0",
]

[project.scripts]
ss = "stock_screener.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_screener"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "-q"]
markers = [
    "integration: tests that hit recorded fixtures",
    "e2e: end-to-end CLI tests",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["src/stock_screener"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
